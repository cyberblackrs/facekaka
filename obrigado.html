<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8FAFC">
  <title>Confirmação de pagamento — Prévia</title>
  <link rel="stylesheet" href="/obrigado.css">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #0F172A; background: #F8FAFC; }
    body { margin: 0; background: #F8FAFC; }
    .wrap { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; }
    .card { width: 100%; max-width: 460px; background: #fff; border: 1px solid #E2E8F0; border-radius: 20px; padding: 34px 32px 28px; text-align: center; box-shadow: 0 12px 35px rgba(15,23,42,.06); }
    .preview { margin: 0 0 24px; font-size: 12px; font-weight: 600; color: #64748B; }
    .symbol { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 21px; background: #EFF6FF; color: #0D54A3; border: 1px solid #BFDBFE; }
    h1 { font-size: clamp(25px, 5.6vw, 30px); line-height: 1.2; letter-spacing: -.035em; margin: 0; font-weight: 750; }
    .intro { font-size: 16px; line-height: 1.6; margin: 10px 0 25px; color: #475569; }
    .next { text-align: left; border-left: 3px solid #0E82F8; padding: 4px 0 4px 16px; }
    .next h2 { margin: 0 0 7px; font-size: 14px; line-height: 1.4; color: #0D54A3; }
    .next p { margin: 0; font-size: 14px; line-height: 1.65; color: #475569; }
    .note { margin: 26px 0 0; font-size: 12px; line-height: 1.6; color: #64748B; }
    @media (max-width: 420px) { .card { padding: 28px 23px 24px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="heading">
      <p class="preview">Prévia de confirmação</p>
      <div class="symbol" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
      </div>
      <h1 id="heading">Pagamento confirmado!</h1>
      <p class="intro">Obrigado pela sua compra.</p>
      <div class="next">
        <h2>Próximos passos</h2>
        <p>Após a confirmação real do pagamento, acompanhe as instruções de acesso pelo canal informado no pedido.</p>
      </div>
      <p class="note">Esta é uma prévia visual, não um comprovante de pagamento.</p>
    </section>
  </main>
</body>
</html>
