<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8FAFC">
  <title>Pagamento Confirmado</title>
  <link rel="stylesheet" href="/obrigado.css">
  <!-- Meta Pixel Code -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
      s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1038848405916345');
  </script>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #0F172A; background: #F8FAFC; }
    body { margin: 0; background: #F8FAFC; }
    .wrap { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; }
    .card { width: 100%; max-width: 460px; background: #fff; border: 1px solid #E2E8F0; border-radius: 20px; padding: 34px 32px 28px; text-align: center; box-shadow: 0 12px 35px rgba(15,23,42,.06); }
    .symbol { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 21px; background: #EFF6FF; color: #0D54A3; border: 1px solid #BFDBFE; }
    h1 { font-size: clamp(25px, 5.6vw, 30px); line-height: 1.2; letter-spacing: -.035em; margin: 0; font-weight: 750; }
    .intro { font-size: 16px; line-height: 1.6; margin: 10px 0 25px; color: #475569; }
    .next { text-align: left; border-left: 3px solid #0E82F8; padding: 4px 0 4px 16px; }
    .next h2 { margin: 0 0 7px; font-size: 14px; line-height: 1.4; color: #0D54A3; }
    .next p { margin: 0; font-size: 14px; line-height: 1.65; color: #475569; }
    .verify-form { display: none; margin-top: 16px; text-align: left; }
    .verify-form.visible { display: block; }
    .verify-label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .verify-row { display: flex; gap: 8px; }
    .verify-input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 14px; border: 1px solid #CBD5E1; border-radius: 10px; color: #0F172A; background: #fff; font-family: inherit; }
    .verify-btn { padding: 10px 14px; font-size: 14px; font-weight: 600; border: 0; border-radius: 10px; background: #0E82F8; color: #fff; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .verify-btn:disabled { opacity: .6; cursor: wait; }
    .note { margin: 26px 0 0; font-size: 12px; line-height: 1.6; color: #64748B; }
    @media (max-width: 420px) { .card { padding: 28px 23px 24px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="heading">
      <div class="symbol" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
      </div>
      <h1 id="heading">Verificando pagamento...</h1>
      <p class="intro" id="intro">Aguardando confirmação do pagamento pelo gateway.</p>
      <div class="next">
        <h2 id="next-title">Validação em andamento</h2>
        <p id="next-text">Estamos conferindo a confirmação da sua transação Pix.</p>
      </div>
      <form class="verify-form" id="verify-form" autocomplete="off">
        <label class="verify-label" for="tx-input">Informe o ID da transação do seu comprovante Pix</label>
        <div class="verify-row">
          <input class="verify-input" id="tx-input" type="text" placeholder="Ex.: txid ou ID da transação" required>
          <button class="verify-btn" id="verify-btn" type="submit">Validar</button>
        </div>
      </form>
    </section>
  </main>
  <script>
    (function () {
      var heading = document.getElementById('heading');
      var intro = document.getElementById('intro');
      var nextTitle = document.getElementById('next-title');
      var nextText = document.getElementById('next-text');
      var verifyForm = document.getElementById('verify-form');
      var txInput = document.getElementById('tx-input');
      var verifyBtn = document.getElementById('verify-btn');

      var purchaseTracked = false;

      function getStorageKey(id) {
        return 'gs_purchase_tracked_' + String(id || '').trim();
      }

      function hasTrackedPurchase(id) {
        if (purchaseTracked) return true;
        var key = getStorageKey(id);
        try {
          if (window.localStorage && window.localStorage.getItem(key) === '1') return true;
        } catch {}
        try {
          if (window.sessionStorage && window.sessionStorage.getItem(key) === '1') return true;
        } catch {}
        return false;
      }

      function markPurchaseTracked(id) {
        purchaseTracked = true;
        var key = getStorageKey(id);
        try {
          if (window.localStorage) window.localStorage.setItem(key, '1');
        } catch {}
        try {
          if (window.sessionStorage) window.sessionStorage.setItem(key, '1');
        } catch {}
      }

      function trackConfirmedPurchase(data) {
        var confirmedId = String((data && data.transactionId) || txId || '').trim();
        if (!confirmedId || !data || data.confirmed !== true) return;
        if (hasTrackedPurchase(confirmedId)) return;
        markPurchaseTracked(confirmedId);

        var numericValue = Number(data.value);
        var purchaseValue = Number.isFinite(numericValue) && numericValue > 0 ? Math.round(numericValue * 100) / 100 : 47;
        var currency = String(data.currency || 'BRL').toUpperCase();

        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Purchase', {
            value: purchaseValue,
            currency: currency
          }, {
            eventID: 'purchase_' + confirmedId
          });
        }
      }

      function unlockMessages() {
        try { localStorage.setItem('gs_msg_unlocked', '1'); } catch {}
      }

      function showConfirmed(data) {
        verifyForm.classList.remove('visible');
        heading.textContent = 'Pagamento confirmado!';
        intro.textContent = 'Obrigado pela sua compra.';
        nextTitle.textContent = 'Acesso ao serviço';
        nextText.textContent = 'Transação validada. O serviço analisa e exibe exclusivamente informações públicas disponíveis dos perfis consultados, conforme anunciado.';
        unlockMessages();
        trackConfirmedPurchase(data);
      }

      function showUnconfirmed(customMessage) {
        heading.textContent = 'Pagamento não confirmado';
        intro.textContent = customMessage || 'Conclua o pagamento no checkout para liberar o acesso.';
        nextTitle.textContent = 'Validação necessária';
        nextText.textContent = 'Nenhuma transação Pix aprovada foi identificada automaticamente. Caso já tenha pago, informe o ID da transação abaixo para validar.';
        verifyForm.classList.add('visible');
      }

      function queryStatus(id) {
        return fetch('/api/payment/status?id=' + encodeURIComponent(id), { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.json() : { confirmed: false }; });
      }

      verifyForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var val = (txInput.value || '').trim();
        if (!val) return;
        verifyBtn.disabled = true;
        queryStatus(val)
          .then(function (data) {
            if (data && data.confirmed === true) {
              txId = String(data.transactionId || val).trim();
              showConfirmed(data);
            } else {
              showUnconfirmed('Transação ainda não confirmada pelo gateway. Aguarde alguns segundos e tente validar novamente.');
            }
          })
          .catch(function () {
            showUnconfirmed('Não foi possível consultar o status agora. Tente novamente em instantes.');
          })
          .finally(function () {
            verifyBtn.disabled = false;
          });
      });

      var params = new URLSearchParams(window.location.search);
      var keys = ['tx', 'txid', 'id', 'transaction_id', 'transactionId', 'payment_id', 'paymentId', 'order_id', 'reference'];
      var txId = '';
      for (var i = 0; i < keys.length; i++) {
        var val = params.get(keys[i]);
        if (val && val.trim()) {
          txId = val.trim();
          break;
        }
      }

      if (!txId) {
        showUnconfirmed();
        return;
      }

      txInput.value = txId;
      var attempts = 0;
      var maxAttempts = 4;

      function checkStatus() {
        attempts += 1;
        queryStatus(txId)
          .then(function (data) {
            if (data && data.confirmed === true) {
              showConfirmed(data);
              return;
            }
            if (attempts < maxAttempts) {
              setTimeout(checkStatus, 2000);
            } else {
              showUnconfirmed();
            }
          })
          .catch(function () {
            if (attempts < maxAttempts) {
              setTimeout(checkStatus, 2000);
            } else {
              showUnconfirmed();
            }
          });
      }

      checkStatus();
    })();
  </script>
</body>
</html>
